# Data counter hasil kurasi manual. Nama, gambar, dan role utama diambil dari API Mobile Legends;
# file ini menambahkan kelemahan, daftar counter, dan role cadangan bila API tidak tersedia.
#
# name        harus sama persis dengan nama hero di API
# roles       role hero (dipakai sebagai cadangan dan role tambahan)
# traits      sifat yang dipakai untuk menyarankan build lawan: heal, cc, burst, magic, physical.
#             Opsional. Tanpa magic/physical, jenis damage ditebak dari role utama;
#             burst otomatis untuk Assassin dan tank otomatis untuk role Tank.
# weakness    alasan singkat kenapa hero ini bisa di-counter, per bahasa (id, en)
# counteredBy hero yang meng-counter hero ini (harus ada di file ini)

